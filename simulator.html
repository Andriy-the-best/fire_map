<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fire danger map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1 data-t="title"></h1>
    <form id="search">
      <input id="q" type="search" autocomplete="off">
      <button type="submit" data-t="go"></button>
    </form>
    <button id="btn-compare" type="button" data-t="compare"></button>
    <button id="btn-lang" type="button"></button>
  </header>

  <main>
    <div id="map"></div>
    <aside id="panel"></aside>
  </main>

  <footer>
    <span data-t="legend"></span>
    <span id="legend"></span>
    <span class="credit">Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a></span>
    <span class="credit">Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> · Borders: geoBoundaries, Natural Earth</span>
  </footer>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="i18n.js"></script>
  <script src="weather.js"></script>
  <script src="risk.js"></script>
  <script src="map.js"></script>
  <script src="compare.js"></script>
  <script src="main.js"></script>
</body>
</html>
